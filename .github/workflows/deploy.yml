name: Automated Movie Web Stories Pipeline & Deploy

on:
  schedule:
    # Runs 4 times daily (every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC)
    # IST: 05:30 AM, 11:30 AM, 05:30 PM, 11:30 PM
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to fetch (all, trending, upcoming, now_playing)'
        required: false
        default: 'all'
      count:
        description: 'Stories per daily cycle (Google Anti-Spam Safe: 3-5)'
        required: false
        default: '4'
      demo_mode:
        description: 'Run in offline demo mode (uses sample data)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "webstories-pipeline"
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js for AMP Validator
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Publisher Assets
        run: |
          python generate_assets.py

      - name: Run Fetch and Generate Pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOMAIN_NAME: 'https://cinematicbites.com'
        run: |
          DEMO_FLAG=""
          if [ "${{ inputs.demo_mode }}" = "true" ]; then
            DEMO_FLAG="--demo"
          fi
          CATEGORY="${{ inputs.category }}"
          if [ -z "$CATEGORY" ] || [ "$CATEGORY" = "true" ]; then
            CATEGORY="all"
          fi
          DAILY_LIMIT="${{ inputs.count }}"
          if [ -z "$DAILY_LIMIT" ] || [ "$DAILY_LIMIT" = "true" ]; then
            DAILY_LIMIT="4"
          fi
          python fetch_and_generate.py \
            --category "$CATEGORY" \
            --daily-limit "$DAILY_LIMIT" \
            $DEMO_FLAG

      - name: Verify 100% AMP Compliance
        run: |
          python validator.py

      - name: Commit and Push Updated Stories & Sitemap
        run: |
          git config --global user.name "ssilu07"
          git config --global user.email "64121882+ssilu07@users.noreply.github.com"
          git add dist/
          if ! git diff-index --quiet HEAD dist/; then
            git commit -m "chore(automated): update AMP web stories and sitemap [skip ci]" --author="ssilu07 <64121882+ssilu07@users.noreply.github.com>"
            for i in 1 2 3; do
              git pull origin main --rebase --autostash || true
              if git push origin main; then
                echo "Successfully pushed changes to main."
                break
              fi
              echo "Push attempt $i failed, retrying in 3s..."
              sleep 3
            done
          else
            echo "::warning title=No New Stories Published::Pipeline did not detect new stories in dist/. Check TMDB & AI generator logs."
          fi

      # Deployment Option A: Cloudflare Pages (Direct Upload via Wrangler)
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cinestories --commit-dirty=true

      # Deployment Option B: Vercel (Using Vercel CLI)
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./dist
          vercel-args: '--prod'
